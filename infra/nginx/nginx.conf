# nginx in front of php-fpm (Laravel API/admin) and Next.js (web).
# Included as conf.d/default.conf, i.e. inside the http{} context, so http-level
# directives (limit_req_zone, upstream, map, gzip) are valid at the top of this file.

# --- Edge rate limiting (per client IP; defence in depth, app throttling still applies) ---
limit_req_zone $binary_remote_addr zone=lms_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=lms_checkout:10m rate=30r/m;

# Docker services can be replaced without recreating nginx. Resolve their names continuously so
# nginx never retains a stopped container's IP after a rolling Compose deployment.
#
# The upstreams below use the COMPOSE SERVICE NAMES. They previously used
# `lms-h-sbvbdl-{api,web}-internal`, a Dokploy-generated project identifier hardcoded in two files
# that had to agree — so the same repository deployed under any other project name resolved nothing
# and returned 502 with no clue as to why. Service names are what Docker's embedded DNS always
# provides, whatever the project is called.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Application upstreams ---
upstream lms_web {
    zone lms_web 64k;
    server web:3000 resolve;
    keepalive 32;
}

upstream lms_api {
    zone lms_api 64k;
    server api:9000 resolve;
    keepalive 16;
}

# --- gzip for text-ish payloads ---
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

# WebSocket upgrade passthrough for the Next.js proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 52M;
    server_tokens off;

    # ---------------- Laravel / php-fpm ----------------
    # Health probes bypass PHP where possible.
    location = /up { try_files $uri /index.php?$query_string; }

    # Filament's published CSS, JavaScript and fonts, served from the volume the API container
    # populates at startup (they used to be baked into THIS image, so they drifted out of step with
    # the PHP that references them). Keep this narrowly scoped so unrelated public paths continue to
    # belong to the Next.js frontend.
    location ~ ^/(?:css|js|fonts)/filament/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js owns the same-origin BFF and session endpoints. These must be selected before the
    # general Laravel /api/ location or Laravel receives paths such as /api/backend/courses and
    # correctly reports them as unknown API routes.
    location ~ ^/api/(?:backend(?:/|$)|session/?$|health/?$) {
        proxy_pass http://lms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 60s;
    }

    # Sensitive API surfaces get edge rate limits on top of Laravel throttling.
    location /api/v1/auth/ {
        limit_req zone=lms_auth burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }
    location /api/v1/checkout {
        limit_req zone=lms_checkout burst=10 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location /api/      { try_files $uri /index.php?$query_string; }
    location /admin     { try_files $uri /index.php?$query_string; }
    location /livewire  { try_files $uri /index.php?$query_string; }
    location /horizon   { try_files $uri /index.php?$query_string; }
    location /storage/  { try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass lms_api;
        # nginx runs in a SEPARATE container that does not contain the Laravel files, so
        # $realpath_root resolves to nothing here and php-fpm receives a bad SCRIPT_FILENAME
        # (every /api/* request 404s). Hardcode the php-fpm container's document root
        # (Dockerfile WORKDIR /var/www/html, public/ under it) so the script path resolves
        # on the API container.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_CORRELATION_ID $http_x_correlation_id;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* { deny all; }

    # ---------------- Everything else -> Next.js ----------------
    location / {
        proxy_pass http://lms_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 60s;
    }
}
