# HElbaron — local development stack.
# The API runs in a container (PHP 8.3) so no PHP install is needed on Windows.
# Host ports are offset (Postgres 55432, Redis 6380) to avoid clashing with the
# user's other running projects; inside the network, services use default ports.
services:
  postgres:
    image: postgres:16-alpine
    container_name: helbaron-postgres
    restart: unless-stopped
    # RefreshDatabase runs `migrate:fresh`, which drops all 189 tables CASCADE in ONE transaction.
    # The public schema holds ~988 relations (tables + their indexes, sequences and constraints), so
    # a single drop takes ~1000 locks. Postgres does NOT cap locks per transaction; it sizes one
    # shared lock table as
    #     max_locks_per_transaction x (max_connections + max_prepared_transactions)
    # which at stock settings is 64 x 100 = 6400 slots for the WHOLE server. One serial run needs
    # ~1000 and fits. Eight parallel test workers each dropping their own schema need ~8000 and
    # overflow it, failing with
    #     SQLSTATE[53200] Out of memory: ERROR: out of shared memory
    #     HINT: You might need to increase max_locks_per_transaction.
    # The overflow lands in whichever tests happen to collide, so it presents as an intermittent
    # flake with a different victim list every run — measured here as 9 failures at 8 workers and 26
    # at 4, on identical code that is 100% green serially.
    # 1024 x 100 = 102400 slots, roughly 17 MB of lock table, with headroom as the schema grows.
    # This belongs in the repo, not in one developer's container: a hand-tuned local fix leaves the
    # next clone and every new developer to rediscover it as unexplained flake.
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    environment:
      POSTGRES_DB: helbaron
      POSTGRES_USER: helbaron
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    volumes:
      - helbaron-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helbaron -d helbaron"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: helbaron-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - helbaron-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: helbaron-api
    restart: unless-stopped
    working_dir: /var/www/html
    # DEV-ONLY concurrent runtime. `php artisan serve` (PHP's built-in server) serialises requests even
    # with PHP_CLI_SERVER_WORKERS, so a page that loads a dozen thumbnails/avatars at once 503s/hangs.
    # Laravel Octane + FrankenPHP gives true parallel workers (installed via `composer require
    # laravel/octane` + `php artisan octane:install --server=frankenphp`). This overrides the image CMD
    # for local dev ONLY — the production image/entrypoint is unchanged and never runs this command.
    # NOTE: Octane keeps the app booted in memory, so after editing PHP code run
    # `docker compose exec api php artisan octane:reload` (or restart the container) to pick it up.
    command: ["php", "artisan", "octane:frankenphp", "--host=0.0.0.0", "--port=8000", "--workers=20", "--max-requests=500"]
    volumes:
      - ./apps/api:/var/www/html
      - ./docker/php/zz-variables-order.ini:/usr/local/etc/php/conf.d/zz-variables-order.ini:ro
    environment:
      # Inside the compose network, reach the backing services by name on their
      # default ports (these override the host-oriented values in .env).
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: predis
      # `php artisan serve` uses PHP's single-threaded built-in server. The Filament admin panel
      # loads ~12 assets in parallel, which a single worker 503s. Spawn worker processes so
      # concurrent requests (assets, Livewire) are served. Requires the pcntl extension (installed).
      PHP_CLI_SERVER_WORKERS: 12
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  helbaron-postgres-data:
  helbaron-redis-data:
